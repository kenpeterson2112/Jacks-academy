<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a13">
<title>Jacks Home Practice</title>
<link rel="icon" type="image/png" sizes="32x32" href="media/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="media/favicon-192.png">
<link rel="apple-touch-icon" href="media/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Graduate&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* Northumberland Jacks branding: black and Jacks green on a maple-bat tan page with cream cards, with Be On Time Athletics yellow as the accent */
    --dark:#0f1a13; --dark-2:#1e5c36; --brand:#16703d; --accent:#f2cf1d; --bg:#ecdfc3;
    --ink:#121a15; --muted:#5b6a60; --line:#dccdab; --ok:#23864a; --ok-bg:#e0f1e5; --card:#fbf8f0;
    --alert:#c0392b; --alert-bg:#fbe3e0; --alert-ink:#8a2318; --soft:#ebe3cf;
    --display:"Graduate", Rockwell, Georgia, serif;
  }
  *{box-sizing:border-box}
  html{scrollbar-gutter:stable}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font:inherit}
  h1,h2,h3{margin:0 0 .4em;line-height:1.15}
  h1,h2,.login h1{font-family:var(--display);font-weight:400;letter-spacing:.01em}
  header.top h1{font-family:var(--display);font-weight:400}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
  .wide{max-width:1000px}
  header.top{background:var(--dark);color:#fff;padding:14px 16px;border-bottom:4px solid var(--brand);position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  header.top .row{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px}
  header.top h1{font-size:1.15rem;margin:0;flex:1}
  .backbtn{background:var(--card);color:var(--dark);border:0;border-radius:999px;padding:9px 18px;font-weight:900;font-size:1rem;cursor:pointer;white-space:nowrap}
  .head-tickets{font-size:1rem;padding:6px 14px;white-space:nowrap}
  .actnav{margin:18px 0}
  .actnav .btn.big{margin-top:10px}
  .actnav .btn.ghost{background:var(--card)}
  .muted{color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 1px 3px rgba(15,26,19,.06)}
  label{display:block;font-weight:800;margin:10px 0 4px;font-size:.92rem}
  input[type=text],input[type=password],input[type=url],input[type=number],input:not([type]),textarea,select{
    width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-top:4px}
  input:focus,textarea:focus{outline:none;border-color:var(--dark-2)}
  textarea{min-height:90px;resize:vertical}
  .pin{font-size:1.8rem;letter-spacing:.6em;text-align:center}
  .btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}
  .btn:disabled{opacity:.55}
  .btn.big{width:100%;padding:16px;font-size:1.1rem;margin-top:14px}
  .btn.dark{background:var(--dark)}
  .btn.ghost{background:transparent;color:var(--dark);border:2px solid var(--line)}
  .btn.small{padding:7px 12px;font-size:.88rem;border-radius:10px}
  .link{background:none;border:0;color:var(--dark-2);font-weight:800;text-decoration:underline;cursor:pointer;padding:8px}
  header .link{color:#fff;opacity:.85}
  .refresh{background:none;border:0;color:#fff;opacity:.85;cursor:pointer;padding:8px;display:grid;place-items:center}
  .refresh:disabled{opacity:.5}
  .refresh.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{background:var(--alert-bg);color:var(--alert-ink);border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:600}
  .login{max-width:420px;margin:0 auto;padding:48px 16px;text-align:center}
  .login form{text-align:left}
  .logo{font-size:3.4rem}
  .act{display:flex;gap:14px;align-items:center;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
  .act .ring{flex:0 0 56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.9rem}
  .act .t{font-weight:900;font-size:1.05rem}
  .chip{display:inline-block;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);margin-bottom:4px}
  .chip.hitting{background:#fdf2bf;color:#6b5600}
  .chip.fielding{background:var(--ok-bg);color:var(--brand)}
  .chip.pitching{background:var(--dark);color:#fff}
  .media{display:block;width:100%;max-width:100%;height:auto;border-radius:12px;margin-top:8px;background:var(--soft)}
  .media + .video{margin-top:12px}
  .done-tag{display:inline-block;background:var(--ok-bg);color:var(--ok);font-weight:800;border-radius:999px;padding:2px 10px;font-size:.8rem;margin-top:4px}
  .step{border-left:5px solid var(--line)}
  .step.ok{border-left-color:var(--ok)}
  .step h3{display:flex;align-items:center;gap:10px;font-size:1.05rem}
  .num{width:28px;height:28px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:.85rem;flex:0 0 28px}
  .step.ok .num{background:var(--ok)}
  .check{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;font-weight:800;margin-top:10px;background:var(--card)}
  .check input{width:26px;height:26px;accent-color:var(--ok)}
  .check.on{border-color:var(--ok);background:var(--ok-bg)}
  .video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin-top:8px}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  ol.drill{padding-left:1.3em;margin:8px 0}
  ol.drill li{margin:6px 0}
  .tip{background:var(--soft);border-left:4px solid var(--brand);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.95rem}
  .gear{padding:0;position:relative}
  .gear summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;display:flex;align-items:center;gap:6px}
  .gear summary::-webkit-details-marker{display:none}
  .gear summary::after{content:"+";margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-size:1.2rem;font-weight:900}
  .gear[open] summary::after{content:"\2212"}
  .gear .pop{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:4;padding:12px 16px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(15,26,19,.18)}
  .gear ul{margin:0;padding-left:20px}
  .gear li{margin:4px 0}
  .gear .reqbtn{display:block;margin:12px auto 0}
  .gear textarea{min-height:70px;margin-top:10px}
  .gear .sent{text-align:center;font-weight:800;color:var(--ok);margin:12px 0 0}
  .fold{margin-top:24px}
  .fold > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;font-weight:900;font-size:1.05rem}
  .fold > summary::-webkit-details-marker{display:none}
  .fold > summary::after{content:"+";margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-size:1.3rem;font-weight:900}
  .fold[open] > summary::after{content:"\2212"}
  .part{font-weight:900;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:14px 0 -2px}
  .tip b{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
  .opt{display:block;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);margin:6px 0;cursor:pointer;font-weight:600}
  .opt.sel{border-color:var(--dark-2);background:var(--soft)}
  .opt.right{border-color:var(--ok);background:var(--ok-bg)}
  .opt.wrong{border-color:var(--alert);background:var(--alert-bg)}
  .q{margin:14px 0}
  .q p{font-weight:800;margin:0 0 4px}
  .banner{background:var(--ok);color:#fff;border-radius:16px;padding:16px;font-weight:900;text-align:center;font-size:1.1rem}
  .helpbtn{width:32px;height:32px;flex:0 0 32px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:none;color:#fff;font-weight:900;font-size:1rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
  .wl-back{position:fixed;inset:0;background:rgba(15,26,19,.62);z-index:30;display:grid;place-items:center;padding:16px}
  .wl{background:var(--card);border-radius:20px;width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto;padding:18px 18px 16px;box-shadow:0 18px 50px rgba(0,0,0,.35);position:relative}
  .wl .hello{font-family:var(--display);font-size:1.25rem;text-align:center;margin:4px 30px 12px}
  .wl .skip{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);font-weight:800;cursor:pointer;padding:6px}
  .wpic{background:var(--bg);border-radius:14px;padding:10px 12px;pointer-events:none;user-select:none;height:290px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .wpic .card{margin:8px 0;padding:12px}
  .wpic .gear .pop{position:static;box-shadow:none;border:0;padding:0 4px 4px}
  .wpic .vid{height:74px;border-radius:10px;background:var(--dark);display:grid;place-items:center;color:#fff;font-size:1.6rem;margin-top:6px}
  .wpic .bar{display:flex;align-items:center;gap:10px;background:var(--dark);color:#fff;border-bottom:4px solid var(--brand);border-radius:12px;padding:12px 14px;font-family:var(--display)}
  .wpic .bar .pill{font-family:Nunito,system-ui,sans-serif;box-shadow:0 0 0 4px rgba(242,207,29,.45)}
  .wl h3{margin:14px 0 4px;font-size:1.15rem}
  .wl p.copy{margin:0;line-height:1.45;min-height:7.3em}
  .wl .foot{display:flex;align-items:center;gap:10px;margin-top:16px}
  .dots{flex:1;display:flex;justify-content:center;gap:7px}
  .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--brand)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:14px 20px;border-radius:999px;font-weight:900;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:20;animation:pop .35s ease}
  @keyframes pop{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .qa{border-top:1px solid var(--line);padding:10px 0}
  .qname{font-weight:900;font-size:1.15rem;color:var(--dark)}
  .qmeta{font-size:.85rem;margin-top:2px}
  .kindtag{display:inline-block;font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:#fdf2bf;color:#6b5600;margin-left:8px;vertical-align:middle}
  .hidebox{display:flex;align-items:center;gap:6px;margin:0;font-size:.88rem;font-weight:800;cursor:pointer;white-space:nowrap}
  .hidebox input{width:20px;height:20px;accent-color:var(--dark)}
  .qa .reply{background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:6px}
  header.top .tabs{max-width:1000px;margin:8px auto -4px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  header.top .tabs::-webkit-scrollbar{display:none}
  .tab{border:2px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:999px;padding:5px 13px;font-size:.92rem;font-weight:800;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .tab.on{background:var(--card);color:var(--dark);border-color:var(--card)}
  .tab:not(.on):hover{border-color:rgba(255,255,255,.6)}
  @media (max-width:520px){ .wide-only{display:none} }
  .badge{background:var(--alert);color:#fff;border-radius:999px;padding:0 7px;font-size:.75rem;margin-left:4px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .plist .p{border-top:1px solid var(--line);padding:12px 0}
  .plist .head{display:flex;align-items:center;gap:10px}
  .plist .tools{display:flex;flex-direction:column;gap:12px;margin-top:12px;padding:12px;background:var(--bg);border-radius:12px}
  .plist .tools .row{gap:10px}
  .plist .tools .lbl{font-weight:800;font-size:.9rem;min-width:110px}
  .plist .danger,.btn.ghost.danger{color:var(--alert);border-color:#efc2bc}
  .pill{background:var(--accent);color:var(--ink);border-radius:999px;padding:2px 10px;font-weight:900;font-size:.85rem}
  .grid{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:.88rem}
  th,td{border-bottom:1px solid var(--line);padding:6px;text-align:center}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:800;z-index:1}
  table.progress tbody th[scope=row]{min-width:130px;max-width:190px;font-size:.85rem;line-height:1.25}
  table.progress th.pname{min-width:52px;max-width:90px;font-size:.8rem;vertical-align:bottom}
  table.progress tr.cat th{padding-top:14px;border-bottom:0;position:static}
  table.progress tr.cat .chip{position:sticky;left:6px}
  table.progress tfoot th,table.progress tfoot td{border-bottom:0;border-top:2px solid var(--line);font-size:.85rem}
  .mark{width:34px;height:34px;border-radius:8px;display:inline-grid;place-items:center;vertical-align:middle}
  .mark.todo{background:var(--bg)}
  .mark.doing{background:#fdf2bf}
  .mark.done{background:var(--ok)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 0 10px;font-size:.85rem;font-weight:700;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend .mark{width:26px;height:26px;border-radius:6px}
  .legend .mark svg{width:18px;height:18px}
  @media (max-width:520px){
    table.progress th,table.progress td{padding:5px 3px}
    table.progress tbody th[scope=row]{min-width:104px;max-width:120px;font-size:.78rem}
    table.progress th.pname{min-width:40px;font-size:.72rem}
    table.progress .mark{width:30px;height:30px}
    table.progress .mark svg{width:19px;height:19px}
  }
  .qedit{border:2px dashed var(--line);border-radius:12px;padding:10px;margin:10px 0}
  .optrow{display:flex;gap:8px;align-items:center;margin-top:6px}
  .optrow input[type=radio]{width:22px;height:22px;accent-color:var(--ok)}
  .roller{font-family:var(--display);font-size:2rem;font-weight:400;text-align:center;padding:26px 10px;background:var(--dark);color:var(--accent);border-radius:16px;margin:12px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* ====== Settings ====== */
const SUPABASE_URL = "https://ieivgzhdgjizwabdlixs.supabase.co";
const SUPABASE_KEY = "sb_publishable_heTKat-H4MX-1uTABW3R4A_hBqyQ7e5";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
const { useState, useEffect, useRef } = React;

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};

const FRIENDLY = {
  BAD_LOGIN: "That name and PIN don't match. Try again!",
  BAD_TOTAL: "Raffle tickets must be a number from 0 to 999.",
  LOCKED: "Too many tries. Wait 10 minutes or ask Coach to reset your PIN.",
  PIN_MUST_BE_4_DIGITS: "PIN must be exactly 4 digits.",
  NO_ENTRIES_YET: "Nobody has any raffle entries yet.",
  PASSPHRASE_TOO_SHORT: "Use at least 8 characters.",
  TITLE_REQUIRED: "Give the activity a title.",
  NOT_LOGGED_IN: "Please log in again.",
  NOT_COACH: "Please log in again.",
};

async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if (error) {
    const msg = error.message || "";
    const code = Object.keys(FRIENDLY).find(c => msg.includes(c));
    let text = code ? FRIENDLY[code] : "Something went wrong. Check your connection and try again.";
    if (msg.includes("players_name_key_uniq")) text = "There is already a player with that name.";
    const e = new Error(text); e.code = code; throw e;
  }
  return data;
}

function ytId(url){
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function Chip({ name }){
  if (!name) return null;
  return <span className={"chip " + name.toLowerCase().replace(/[^a-z]/g, "")}>{name}</span>;
}

const qIcon = q => q.kind === "request" ? "🧰" : "❓";

function stepsFor(a){
  const s = [];
  if (a.video_url || a.image_url) s.push(["watched", "Watch"]);
  if (a.quiz && a.quiz.length) s.push(["quiz_done", "Pass the quiz"]);
  s.push(["drill_done", "Do the drill"]);
  if (a.video_requested) s.push(["video_sent", "Send your video"]);
  return s;
}

/* ====== App ====== */
function App(){
  const [session, setSession] = useState(() => store.get("jhp_session"));
  const login = s => { store.set("jhp_session", s); setSession(s); };
  const logout = async () => {
    if (session) { try { await rpc("logout", { p_token: session.token }); } catch {} }
    store.del("jhp_session"); setSession(null);
  };
  if (!session) return <Login onLogin={login} />;
  if (session.role === "coach") return <Coach session={session} onLogout={logout} />;
  return <Player session={session} onLogout={logout} />;
}

function Shell({ title, onLogout, children, wide, onRefresh, refreshing, onBack, right, nav, onHelp }){
  return (
    <>
      <header className="top"><div className="row">
        {onBack
          ? <button className="backbtn" onClick={onBack}>← Back</button>
          : <span style={{fontSize:"1.4rem"}}>⚾</span>}
        <h1>{title}</h1>
        {right}
        {onRefresh && <button className={"refresh" + (refreshing ? " spin" : "")} onClick={onRefresh} disabled={refreshing} title="Refresh" aria-label="Refresh">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/></svg>
        </button>}
        {onHelp && <button className="helpbtn" onClick={onHelp} title="Help" aria-label="Help">?</button>}
        {onLogout && <button className="link" onClick={onLogout}>Log out</button>}
      </div>{nav}</header>
      <div className={"wrap" + (wide ? " wide" : "")}>{children}</div>
    </>
  );
}

/* ====== Login ====== */
function Login({ onLogin }){
  const [mode, setMode] = useState("player");
  const [name, setName] = useState(""); const [pin, setPin] = useState(""); const [pass, setPass] = useState("");
  const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);

  async function submit(e){
    e.preventDefault(); setErr(""); setBusy(true);
    try {
      if (mode === "player") {
        const r = await rpc("player_login", { p_name: name, p_pin: pin });
        if (!r.ok) throw new Error(FRIENDLY[r.error] || FRIENDLY.BAD_LOGIN);
        onLogin({ role: "player", token: r.token, name: r.name });
      } else {
        const r = await rpc("coach_login", { p_pass: pass });
        if (!r.ok) throw new Error("That passphrase isn't right.");
        onLogin({ role: "coach", token: r.token, name: "Coach" });
      }
    } catch (ex) { setErr(ex.message); setPin(""); }
    finally { setBusy(false); }
  }

  return (
    <div className="login">
      <div className="logo">⚾</div>
      <h1>Jacks Home Practice</h1>
      <p className="muted">Practice at home. Earn raffle entries.</p>
      <form className="card" onSubmit={submit}>
        {mode === "player" ? <>
          <label>Your name<input name="username" value={name} onChange={e => setName(e.target.value)} autoCapitalize="words" autoCorrect="off" spellCheck={false} autoComplete="username" required /></label>
          <label>Your 4-digit PIN<input className="pin" name="password" type="password" inputMode="numeric" autoComplete="current-password"
            value={pin} onChange={e => setPin(e.target.value.replace(/\D/g, "").slice(0, 4))} required pattern="[0-9]{4}" /></label>
        </> : <>
          <input type="text" name="username" autoComplete="username" value="Coach" readOnly hidden />
          <label>Coach passphrase<input name="password" type="password" autoComplete="current-password" value={pass} onChange={e => setPass(e.target.value)} required /></label>
        </>}
        {err && <div className="err">{err}</div>}

function Player({ session, onLogout }){
  const [home, setHomeRaw] = useState(null);
  const [openId, setOpenId] = useState(() => (history.state && history.state.jhpAct) || null);
  const [err, setErr] = useState("");
  const [toast, setToast] = useState("");
  const [welcome, setWelcome] = useState(false);
  const prevEntries = useRef(null);
  const welcomeKey = name => "jhp_welcome_seen:" + name.toLowerCase();
  useEffect(() => { if (home && !store.get(welcomeKey(home.name))) setWelcome(true); }, [!!home]);
  const closeWelcome = () => { store.set(welcomeKey(home.name), true); setWelcome(false); };

  function setHome(h){
    if (prevEntries.current !== null && h.entries > prevEntries.current) {
      const gained = h.entries - prevEntries.current;
      setToast(`🎟️ +${gained} raffle ${gained === 1 ? "entry" : "entries"}!`);
      setTimeout(() => setToast(""), 3200);
    }
    prevEntries.current = h.entries;
    setHomeRaw(h);
  }
  async function guard(p){
    try { const d = await p; setErr(""); return d; }
    catch (e) { if (e.code === "NOT_LOGGED_IN") onLogout(); else setErr(e.message); throw e; }
  }
  useEffect(() => { guard(rpc("player_home", { p_token: session.token })).then(setHome).catch(() => {}); }, []);

  /* Opening an activity adds a browser history entry, so the phone's back button or swipe returns to the list */
  useEffect(() => {
    const onPop = e => { setOpenId((e.state && e.state.jhpAct) || null); window.scrollTo(0, 0); };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  const openAct = id => { history.pushState({ jhpAct: id }, ""); setOpenId(id); window.scrollTo(0, 0); };
  const nextAct = id => { history.replaceState({ jhpAct: id }, ""); setOpenId(id); window.scrollTo(0, 0); };
  const back = () => {
    if (history.state && history.state.jhpAct) history.back();
    else { setOpenId(null); window.scrollTo(0, 0); }
  };

  const api = {
    setStep: (id, step, val) => guard(rpc("player_set_step", { p_token: session.token, p_activity: id, p_step: step, p_value: val })).then(setHome).catch(() => {}),
    quiz: async (id, answers) => { const r = await guard(rpc("player_submit_quiz", { p_token: session.token, p_activity: id, p_answers: answers })); setHome(r.home); return r; },
    ask: (id, body) => guard(rpc("player_ask", { p_token: session.token, p_activity: id, p_body: body })).then(setHome),
    request: (id, body) => guard(rpc("player_request_equipment", { p_token: session.token, p_activity: id, p_body: body })).then(setHome),
  };

  if (!home) return <Shell title="Loading..." onLogout={onLogout}>{err && <div className="err">{err}</div>}</Shell>;
  const act = home.activities.find(a => a.id === openId);
  let next = null;
  if (act) {
    const list = home.activities, i = list.indexOf(act);
    next = [...list.slice(i + 1), ...list.slice(0, i)].find(x => !x.completed_at) || null;
  }

  return (
    <Shell title={act ? "" : `Hi ${home.name}!`} onLogout={act ? null : onLogout} onBack={act ? back : null} onHelp={() => setWelcome(true)}
      right={<span className="pill head-tickets" title="Your raffle entries">🎟️ {home.entries}</span>}>
      {err && <div className="err">{err}</div>}
      {act
        ? <ActivityView a={act} questions={home.questions.filter(q => q.activity_id === act.id)} api={api} onBack={back} next={next} onNext={nextAct} />
        : <PlayerHome home={home} onOpen={openAct} />}
      {toast && <div className="toast">{toast}</div>}
      {welcome && <Welcome name={home.name} onClose={closeWelcome} />}
    </Shell>
  );
}

/* Drill step lines: "Equipment:" lines list what you need, "Setup:" and "Look for:" lines show as tips,
   "Part:" lines start a new section (a subheading, with numbering starting over), every other line is a numbered step */
const LABEL = /^(equipment|setup|look for|part):\s*/i;
const labelOf = s => (s.match(LABEL) || [])[1];
const drillLines = text => (text || "").split("\n").map(s => s.trim()).filter(Boolean);
const equipmentOf = text => drillLines(text).filter(s => /^equipment$/i.test(labelOf(s) || "")).map(s => s.replace(LABEL, "")).filter(Boolean);

const parts = lines => {
  const out = [{ title: "", steps: [] }];
  lines.forEach(s => {
    const l = (labelOf(s) || "").toLowerCase();
    if (l === "part") out.push({ title: s.replace(LABEL, ""), steps: [] });
    else if (!l) out[out.length - 1].steps.push(s);
  });
  return out.filter(g => g.title || g.steps.length);
};

function DrillSteps({ text }){
  const lines = drillLines(text);
  const tip = label => lines.filter(s => (labelOf(s) || "").toLowerCase() === label)
    .map((s, i) => <div className="tip" key={label + i}><b>{labelOf(s)}</b>{s.replace(LABEL, "")}</div>);
  return (
    <>
      {tip("setup")}
      {parts(lines).map((g, i) => <React.Fragment key={i}>
        {g.title && <div className="part">{g.title}</div>}
        {g.steps.length > 0 && <ol className="drill">{g.steps.map((s, j) => <li key={j}>{s}</li>)}</ol>}
      </React.Fragment>)}
      {tip("look for")}
    </>
  );
}

function Equipment({ a, api }){
  const items = equipmentOf(a.drill_steps);
  const ref = useRef(null);
  const [asking, setAsking] = useState(false); const [body, setBody] = useState("");
  const [busy, setBusy] = useState(false); const [sent, setSent] = useState(false);
  async function send(){
    if (!body.trim()) return; setBusy(true);
    try { await api.request(a.id, body); setBody(""); setAsking(false); setSent(true); setTimeout(() => setSent(false), 4000); } catch {} finally { setBusy(false); }
  }
  /* The list floats over the page; tapping anywhere else (or Escape) closes it */
  useEffect(() => {
    const close = e => { const d = ref.current; if (d && d.open && (e.key === "Escape" || (e.type === "pointerdown" && !d.contains(e.target)))) d.open = false; };
    document.addEventListener("pointerdown", close); document.addEventListener("keydown", close);
    return () => { document.removeEventListener("pointerdown", close); document.removeEventListener("keydown", close); };
  }, []);
  if (!items.length) return null;
  return (
    <details className="card gear" ref={ref}>
      <summary>🧰 Equipment List <span className="muted">({items.length})</span></summary>
      <div className="pop">
        <ul>{items.map((x, i) => <li key={i}>{x}</li>)}</ul>
        {sent && <p className="sent">Sent! Coach will get back to you.</p>}
        {!asking && !sent && <button className="btn small reqbtn" onClick={() => setAsking(true)}>Request equipment</button>}
        {asking && <>
          <textarea autoComplete="off" value={body} onChange={e => setBody(e.target.value.slice(0, 500))} placeholder="What do you need? Coach will see this." autoFocus />
          <div className="row" style={{justifyContent:"center",marginTop:8}}>
            <button className="btn small" disabled={busy || !body.trim()} onClick={send}>{busy ? "Sending..." : "Send request"}</button>
            <button className="btn ghost small" onClick={() => { setAsking(false); setBody(""); }}>Cancel</button>
          </div>
        </>}
      </div>
    </details>
  );
}

            <span className="lbl">Raffle tickets</span>
            <button className="btn ghost small" onClick={() => step(-1)} disabled={(tixNum ?? 0) <= 0} aria-label="One less ticket">−</button>
            <input value={tix} inputMode="numeric" autoComplete="off" aria-label="Raffle tickets" style={{width:64,marginTop:0,textAlign:"center",fontWeight:800}}
              onChange={e => setTix(e.target.value.replace(/\D/g, "").slice(0, 3))} />
            <button className="btn ghost small" onClick={() => step(1)} disabled={(tixNum ?? 0) >= 999} aria-label="One more ticket">+</button>
            {tixNum !== null && tixNum !== p.entries && <>
              <button className="btn small" onClick={() => call("coach_set_entries", { p_player: p.id, p_total: tixNum }).catch(() => {})}>Save</button>
              <button className="btn ghost small" onClick={() => setTix(String(p.entries))}>Undo</button>
            </>}
          </div>
          <div className="muted" style={{fontSize:".82rem",marginTop:4}}>
            {earned} from finished activities{p.bonus > 0 ? `, ${p.bonus} added by a coach` : p.bonus < 0 ? `, ${-p.bonus} taken away by a coach` : ""}. Starting a new raffle round sets this back to 0.
          </div>
        </div>
        <div className="row">
          <span className="lbl">New PIN</span>
          <input autoComplete="off" value={pin} inputMode="numeric" style={{width:100,marginTop:0}} placeholder="4 digits"
            onChange={e => setPin(e.target.value.replace(/\D/g, "").slice(0, 4))} />
          <button className="btn ghost small" disabled={pin.length !== 4}
            onClick={() => call("coach_reset_pin", { p_player: p.id, p_pin: pin }).then(() => setPin("")).catch(() => {})}>Save PIN</button>
        </div>
        <div className="row">
          {!sure
            ? <button className="btn ghost small danger" onClick={() => setSure(true)}>Remove player</button>
            : <><span style={{fontWeight:700}}>Remove {p.name} and all their progress?</span>
                <button className="btn small" onClick={() => call("coach_delete_player", { p_player: p.id })}>Yes, remove</button>
                <button className="btn ghost small" onClick={() => setSure(false)}>Cancel</button></>}
        </div>
      </div>}
    </div>
  );
}

function PlayersTab({ d, call, busy }){
  const [name, setName] = useState(""); const [pin, setPin] = useState(""); const [openId, setOpenId] = useState(null);
  const add = e => { e.preventDefault(); call("coach_add_player", { p_name: name, p_pin: pin }).then(() => { setName(""); setPin(""); }).catch(() => {}); };
  return (
    <>
      <form className="card" onSubmit={add}>
        <h3>Add a player</h3>
        <div className="row">
          <div className="grow" style={{minWidth:160}}><label>Name (what they type to log in)<input autoComplete="off" value={name} onChange={e => setName(e.target.value)} required placeholder="e.g. Liam S" /></label></div>
          <div style={{width:130}}><label>4-digit PIN<input autoComplete="off" value={pin} inputMode="numeric" onChange={e => setPin(e.target.value.replace(/\D/g, "").slice(0, 4))} required pattern="[0-9]{4}" /></label></div>
        </div>
        <button className="btn" style={{marginTop:12}} disabled={busy}>Add player</button>
      </form>
      <div className="card plist">
        <h3>Team ({d.players.length})</h3>
        {d.players.length === 0 && <p className="muted">No players yet. Add your first one above.</p>}
        {d.players.map(p => <PlayerRow key={p.id} p={p} call={call} open={openId === p.id} onToggle={() => setOpenId(openId === p.id ? null : p.id)} />)}
      </div>
    </>
  );
}

const MARKS = {
  todo: { label: "Not started", icon: <circle cx="12" cy="12" r="6" fill="#b9c4bc" /> },
  doing: { label: "In progress", icon: <g stroke="var(--ink)" strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round">
    <path d="M6 3.5h12M6 20.5h12" fill="none" /><path d="M7.5 3.5h9L12 12zM12 12l4.5 8.5h-9z" fill="var(--accent)" /></g> },
  done: { label: "Complete", icon: <path d="M6 12.5l4 4 8-8.5" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" /> },
};

function Mark({ kind, title }){
  return <span className={"mark " + kind} title={title || MARKS[kind].label}><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">{MARKS[kind].icon}</svg></span>;
}

function ProgressTab({ d }){
  const acts = d.activities.filter(a => a.published);
  const pr = {}; d.progress.forEach(r => { pr[r.player_id + ":" + r.activity_id] = r; });
  const status = (p, a) => {
    const r = pr[p.id + ":" + a.id]; const steps = stepsFor(a);
    const n = r ? steps.filter(([k]) => r[k]).length : 0;
    const kind = r && r.completed_at ? "done" : n > 0 ? "doing" : "todo";
    return { kind, title: `${p.name}: ${MARKS[kind].label}` + (kind === "doing" ? ` (${n} of ${steps.length} steps)` : "") };
  };
  if (!d.players.length || !acts.length) return <p className="muted" style={{marginTop:20}}>Progress shows up here once there are players and visible activities.</p>;
  const rows = []; let cat = null;
  acts.forEach(a => {
    if (a.category !== cat) { cat = a.category; if (cat) rows.push(<tr key={"cat-" + a.id} className="cat"><th colSpan={d.players.length + 1}><Chip name={cat} /></th></tr>); }
    rows.push(<tr key={a.id}><th scope="row">{a.title}</th>
      {d.players.map(p => { const m = status(p, a); return <td key={p.id}><Mark kind={m.kind} title={m.title} /></td>; })}</tr>);
  });
  return (
    <div className="card">
      <h3>Who has done what</h3>
      <div className="legend">{Object.keys(MARKS).map(k => <span key={k}><Mark kind={k} />{MARKS[k].label}</span>)}</div>
      <div className="grid">
        <table className="progress">
          <thead><tr><th>Activity</th>{d.players.map(p => <th key={p.id} className="pname">{p.name}</th>)}</tr></thead>
          <tbody>{rows}</tbody>
          <tfoot><tr><th scope="row">🎟️ Raffle entries</th>{d.players.map(p => <td key={p.id}><b>{p.entries}</b></td>)}</tr></tfoot>
        </table>
      </div>
    </div>
  );
}

const blankActivity = () => ({ title: "", summary: "", category: "", video_url: "", image_url: "", drill_steps: "", quiz: [], video_requested: false, video_note: "", sort_order: 0, published: true });

function ActivitiesTab({ d, call, busy }){
  const [edit, setEdit] = useState(null);
  const cats = [...new Set(["Hitting", "Fielding", "Pitching", ...d.activities.map(a => a.category).filter(Boolean)])];
  if (edit) return <ActivityEditor initial={edit} busy={busy} cats={cats} onCancel={() => setEdit(null)}
    onSave={a => call("coach_save_activity", { p: a }).then(() => setEdit(null)).catch(() => {})}
    onDelete={a => { if (confirm(`Delete "${a.title}"? Players lose progress on it.`)) call("coach_delete_activity", { p_activity: a.id }).then(() => setEdit(null)); }} />;
  return (
    <>
      <button className="btn" style={{marginTop:14}} onClick={() => setEdit({ ...blankActivity(), sort_order: d.activities.length + 1 })}>+ New activity</button>
      {d.activities.map(a => (
        <div className="card row" key={a.id}>
          <div className="grow" style={{minWidth:220}}><Chip name={a.category} /><div><b>{a.title}</b> {!a.published && <span className="badge">hidden</span>}</div>
            <div className="muted" style={{fontSize:".88rem"}}>{a.quiz.length} quiz Qs · {a.video_url ? "video" : a.image_url ? "image/GIF" : "nothing to watch yet"} · {a.video_requested ? "asks for a video (2 🎟️)" : "1 🎟️"}</div></div>
          <div className="row" style={{gap:14}}>
          <button className="btn ghost small" onClick={() => setEdit({ ...a, category: a.category || "", video_url: a.video_url || "", image_url: a.image_url || "" })}>Edit</button>
          <label className="hidebox" title="Players won't see this activity while it's hidden">
            <input type="checkbox" checked={!a.published} disabled={busy} onChange={e => call("coach_save_activity", { p: { ...a, published: !e.target.checked } }).catch(() => {})} />Hide from players
          </label>
          </div>
        </div>
      ))}
    </>
  );
}

function ActivityEditor({ initial, onSave, onCancel, onDelete, busy, cats }){
  const [a, setA] = useState(JSON.parse(JSON.stringify(initial)));
  const set = (k, v) => setA({ ...a, [k]: v });
  const setQ = (i, q) => { const qs = [...a.quiz]; qs[i] = q; set("quiz", qs); };
  const [newCat, setNewCat] = useState(!!a.category && !cats.includes(a.category));
  return (
    <div className="card">
      <h3>{a.id ? "Edit activity" : "New activity"}</h3>
      <label>Title<input autoComplete="off" value={a.title} onChange={e => set("title", e.target.value)} /></label>
      <label>Short description<input autoComplete="off" value={a.summary} onChange={e => set("summary", e.target.value)} /></label>
      <label>Category (the skill it works on)
        <select value={newCat ? "__new" : a.category} onChange={e => { const v = e.target.value; setNewCat(v === "__new"); set("category", v === "__new" ? "" : v); }}>
          <option value="">Choose a category</option>
          {cats.map(c => <option key={c} value={c}>{c}</option>)}
          <option value="__new">+ New category...</option>
        </select></label>
      {newCat && <input autoComplete="off" value={a.category} onChange={e => set("category", e.target.value)} placeholder="New category name, e.g. Catching" autoFocus />}
      <label>YouTube link (optional)<input autoComplete="off" type="url" value={a.video_url} onChange={e => set("video_url", e.target.value)} placeholder="https://youtube.com/..." /></label>
      <label>Image or GIF link (optional)<input autoComplete="off" value={a.image_url} onChange={e => set("image_url", e.target.value)} placeholder="https://.../drill.gif or media/drill.gif" /></label>
      {a.image_url.trim() && <img className="media" src={a.image_url.trim()} alt="Preview" style={{maxWidth:320}} />}
      <label>Drill steps (one per line)<textarea autoComplete="off" value={a.drill_steps} onChange={e => set("drill_steps", e.target.value)} style={{minHeight:160}} /></label>
      <p className="muted" style={{fontSize:".8rem",margin:"4px 0 0"}}>Start a line with "Equipment:" for each thing players need (shown at the top), or with "Setup:" or "Look for:" to show it as a tip instead of a numbered step. A line starting with "Part:" (like "Part: Standing") starts a new section with its own numbering.</p>
      <label className="check" style={{fontWeight:800}}><input type="checkbox" checked={a.video_requested} onChange={e => set("video_requested", e.target.checked)} />Ask players to send a video (worth 2 entries)</label>
      {a.video_requested && <label>Video instructions<input autoComplete="off" value={a.video_note} onChange={e => set("video_note", e.target.value)} placeholder="Send Coach a short clip on WhatsApp." /></label>}

      <h3 style={{marginTop:18}}>Quiz</h3>
      {a.quiz.map((q, i) => (
        <div className="qedit" key={i}>
          <div className="row"><b className="grow">Question {i + 1}</b><button className="btn ghost small" onClick={() => set("quiz", a.quiz.filter((_, j) => j !== i))}>Remove</button></div>
          <input autoComplete="off" value={q.q} onChange={e => setQ(i, { ...q, q: e.target.value })} placeholder="Question" />
          {q.options.map((o, oi) => (
            <div className="optrow" key={oi}>
              <input type="radio" name={"ans" + i} checked={q.answer === oi} onChange={() => setQ(i, { ...q, answer: oi })} title="Correct answer" />
              <input autoComplete="off" value={o} onChange={e => { const os = [...q.options]; os[oi] = e.target.value; setQ(i, { ...q, options: os }); }} placeholder={`Answer ${oi + 1}`} />
              {q.options.length > 2 && <button className="btn ghost small" onClick={() => { const os = q.options.filter((_, j) => j !== oi); setQ(i, { ...q, options: os, answer: Math.min(q.answer, os.length - 1) }); }}>×</button>}
            </div>
          ))}
          <p className="muted" style={{fontSize:".8rem",margin:"6px 0 0"}}>Tap the circle beside the right answer.</p>
          {q.options.length < 4 && <button className="link" onClick={() => setQ(i, { ...q, options: [...q.options, ""] })}>+ add answer</button>}
        </div>
      ))}
      <button className="btn ghost small" onClick={() => set("quiz", [...a.quiz, { q: "", options: ["", "", ""], answer: 0 }])}>+ Add question</button>

      <div className="row" style={{marginTop:14}}>
        <label className="check" style={{margin:0}}><input type="checkbox" checked={a.published} onChange={e => set("published", e.target.checked)} />Visible to players</label>
        <div style={{width:110}}><label>Order<input autoComplete="off" type="number" value={a.sort_order} onChange={e => set("sort_order", parseInt(e.target.value || "0", 10))} /></label></div>
      </div>
      <div className="row" style={{marginTop:16}}>
        <button className="btn" disabled={busy} onClick={() => onSave(a)}>Save</button>
        <button className="btn ghost" onClick={onCancel}>Cancel</button>
        <div className="grow" />
        {a.id && <button className="btn ghost" onClick={() => onDelete(a)}>Delete</button>}
      </div>
    </div>
  );
}

function QuestionsTab({ d, call }){
  const title = id => (d.activities.find(a => a.id === id) || {}).title || "General";
  if (!d.questions.length) return <p className="muted" style={{marginTop:20}}>No questions or equipment requests yet.</p>;
  const open = d.questions.filter(q => !q.reply), answered = d.questions.filter(q => q.reply);
  const requests = open.filter(q => q.kind === "request"), questions = open.filter(q => q.kind !== "request");
  return (
    <>
      {open.length === 0 && <p className="muted" style={{marginTop:20}}>Nothing new. You're all caught up!</p>}
      {requests.length > 0 && <h2 style={{marginTop:20}}>🧰 Equipment requests</h2>}
      {requests.map(q => <QuestionCard key={q.id} q={q} title={title(q.activity_id)} call={call} />)}
      {questions.length > 0 && <h2 style={{marginTop:20}}>❓ Questions</h2>}
      {questions.map(q => <QuestionCard key={q.id} q={q} title={title(q.activity_id)} call={call} />)}
      {answered.length > 0 && <details className="fold">
        <summary>✅ Answered <span className="muted">({answered.length})</span></summary>
        {answered.map(q => <QuestionCard key={q.id} q={q} title={title(q.activity_id)} call={call} />)}
      </details>}
    </>
  );
}
function QuestionCard({ q, title, call }){
  const [r, setR] = useState(q.reply || "");
  return (
    <div className="card">
      <div className="qname">{q.player}{q.kind === "request" && <span className="kindtag">Equipment request</span>}</div>
      <div className="muted qmeta">{title} · {new Date(q.created_at).toLocaleDateString()}</div>
      <p style={{fontWeight:800,margin:"8px 0 6px"}}>{qIcon(q)} {q.body}</p>
      <textarea autoComplete="off" value={r} onChange={e => setR(e.target.value)} placeholder={q.kind === "request" ? "Your reply, e.g. I'll bring one to practice" : "Your reply"} style={{minHeight:60}} />
      <button className="btn small" style={{marginTop:6}} onClick={() => call("coach_reply", { p_question: q.id, p_reply: r })}>{q.reply ? "Update reply" : "Reply"}</button>
    </div>
  );
}

function RaffleTab({ d, setD, run, t, call, busy }){
  const [prize, setPrize] = useState(""); const [rolling, setRolling] = useState(null); const [win, setWin] = useState(null);
  const total = d.players.reduce((s, p) => s + p.entries, 0);
  async function draw(prize){
    if (!prize.trim()) return; setWin(null);
    let r; try { r = await run(rpc("coach_draw", { p_token: t, p_prize: prize })); } catch { return; }
    const names = d.players.filter(p => p.entries > 0).map(p => p.name); let i = 0;
    const iv = setInterval(() => {
      setRolling(names[Math.floor(Math.random() * names.length)]);
      if (++i > 24) { clearInterval(iv); setRolling(null); setWin({ ...r, prize }); setD(r.dashboard); }
    }, 85);
  }
  return (
    <>
      <div className="card">
        <h3>Draw a winner</h3>
        <p className="muted">{total} {total === 1 ? "entry" : "entries"} in this round. More entries = better odds.</p>
        <div className="row" style={{marginTop:10}}>
          <input autoComplete="off" className="grow" value={prize} onChange={e => setPrize(e.target.value)} placeholder="Prize" />
          <button className="btn" disabled={busy || rolling || !total || !prize.trim()} onClick={() => draw(prize)}>Draw</button>
        </div>
        {rolling && <div className="roller">{rolling}</div>}
        {win && <div className="roller">🎉 {win.winner}<div style={{fontSize:"1rem",color:"#fff"}}>wins: {win.prize} ({win.entries} of {win.total} entries)</div></div>}
      </div>
      <div className="card">
        <h3>Past draws</h3>
        {d.draws.length === 0 && <p className="muted">None yet.</p>}
        {d.draws.map(x => <div className="qa" key={x.id}><b>{x.player_name}</b> won {x.prize} <span className="muted">· {new Date(x.drawn_at).toLocaleDateString()}</span></div>)}
      </div>
      <div className="card">
        <h3>Start a new round</h3>
        <p className="muted">Sets everyone's entries back to 0. Finished activities stay finished.</p>
        <button className="btn ghost" onClick={() => { if (confirm("Start a new raffle round? Everyone's entries go back to 0.")) call("coach_new_round"); }}>Start new round</button>
      </div>
    </>
  );
}

function SettingsTab({ run, t, d, call }){
  const [p1, setP1] = useState(""); const [p2, setP2] = useState(""); const [msg, setMsg] = useState("");
  async function save(e){
    e.preventDefault(); setMsg("");
    if (p1 !== p2) { setMsg("Those don't match."); return; }
    try { await run(rpc("coach_change_pass", { p_token: t, p_new: p1 })); setMsg("Passphrase changed. Other coach logins were signed out."); setP1(""); setP2(""); } catch {}
  }
  return (
    <>
    <form className="card" onSubmit={save}>
      <h3>Change coach passphrase</h3>
      <p className="muted">Share this with your other coaches. At least 8 characters.</p>
      <input type="text" name="username" autoComplete="username" value="Coach" readOnly hidden />
      <label>New passphrase<input name="new-password" type="password" autoComplete="new-password" value={p1} onChange={e => setP1(e.target.value)} required /></label>
      <label>Type it again<input name="confirm-password" type="password" autoComplete="new-password" value={p2} onChange={e => setP2(e.target.value)} required /></label>
      <button className="btn" style={{marginTop:12}}>Save</button>
      {msg && <p style={{fontWeight:800}}>{msg}</p>}
    </form>
    <ResetData d={d} call={call} />
    </>
  );
}

/* Coach "Reset data" options. Each one asks again before it runs; nothing here can be undone. */
function ResetData({ d, call }){
  const tickets = d.players.reduce((n, p) => n + p.entries, 0);
  const done = d.progress.filter(r => r.completed_at).length;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const rows = [
    ["questions", "Questions and equipment requests", "Deletes every question and equipment request players have sent, and your replies.", d.questions.length, plural(d.questions.length, "message", "messages")],
    ["draws", "Past raffle draws", "Deletes the list of past winners and prizes on the Raffle tab.", d.draws.length, plural(d.draws.length, "draw", "draws")],
    ["tickets", "Raffle tickets", "Sets every player back to 0 tickets and clears bonus tickets. Finished activities stay finished. (Same as Start new round on the Raffle tab.)", tickets, plural(tickets, "ticket", "tickets")],
    ["progress", "Activity progress", "Clears every player's checkmarks and finished activities, so everyone starts fresh. This also takes away the tickets those activities earned.", d.progress.length, plural(done, "finished activity", "finished activities")],
  ];
  return (
    <div className="card">
      <h3>Reset data</h3>
      <div className="err" style={{marginTop:0}}>⚠️ Resetting permanently deletes data. Once it is gone, it cannot be restored. Players, PINs and activities are never touched.</div>
      {rows.map(([what, title, detail, count, summary]) => <ResetRow key={what} what={what} title={title} detail={detail} count={count} summary={summary} call={call} />)}
    </div>
  );
}

function ResetRow({ what, title, detail, count, summary, call }){
  const [sure, setSure] = useState(false); const [busy, setBusy] = useState(false); const [msg, setMsg] = useState("");
  async function go(){
    setBusy(true);
    try { await call("coach_reset", { p_what: what }); setMsg("Done. " + title + " reset."); setSure(false); } catch {} finally { setBusy(false); }
  }
  return (
    <div className="qa">
      <div className="row">
        <div className="grow" style={{minWidth:180}}><b>{title}</b> <span className="muted" style={{fontSize:".85rem"}}>({summary})</span>
          <div className="muted" style={{fontSize:".88rem"}}>{detail}</div></div>
        {!sure && <button className="btn ghost small danger" disabled={!count} onClick={() => { setSure(true); setMsg(""); }}>{count ? "Reset" : "Nothing to reset"}</button>}
      </div>
      {sure && <div className="err">
        Reset {title.toLowerCase()} for everyone? This cannot be undone.
        <div className="row" style={{marginTop:8}}>
        <button className="btn small" style={{background:"var(--alert)"}} disabled={busy} onClick={go}>{busy ? "Resetting..." : "Yes, reset"}</button>
        <button className="btn ghost small" disabled={busy} onClick={() => setSure(false)}>Cancel</button>
        </div>
      </div>}
      {msg && <p style={{fontWeight:800,color:"var(--ok)",margin:"6px 0 0"}}>{msg}</p>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
