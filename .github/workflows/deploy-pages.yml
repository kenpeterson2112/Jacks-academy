name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/outfield-iq-game-09o2nh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: archive/outfield-iq/package-lock.json
      - run: npm ci
        working-directory: archive/outfield-iq
      - run: npm run build
        working-directory: archive/outfield-iq
      - run: |
          mkdir -p pages-root/outfield-iq
          cp -r archive/outfield-iq/dist/. pages-root/outfield-iq/
          cp *.html pages-root/
          if [ -d media ]; then cp -r media pages-root/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
